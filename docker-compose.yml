services:
  postgres:
    image: postgres:16-alpine
    container_name: supmeal_db
    restart: unless-stopped
    # Les trois valeurs ci-dessous sont exigées explicitement (syntaxe ${VAR:?message}). Sans .env,
    # Compose interrompt le lancement en affichant la consigne à suivre, au lieu de laisser
    # démarrer une pile qui échouerait plus loin sur une erreur de l’image PostgreSQL.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supmeal}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?absent, copiez .env.example en .env avant docker compose up}"
      POSTGRES_DB: ${POSTGRES_DB:-supmeal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supmeal} -d ${POSTGRES_DB:-supmeal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: supmeal_server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-supmeal}:${POSTGRES_PASSWORD:?absent, copiez .env.example en .env avant docker compose up}@postgres:5432/${POSTGRES_DB:-supmeal}"
      JWT_SECRET: "${JWT_SECRET:?absent, copiez .env.example en .env avant docker compose up}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:?absent, copiez .env.example en .env avant docker compose up}"
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-http://localhost:3000}
    # Le résolveur DNS embarqué de Docker ne relaie pas toujours les requêtes externes selon la
    # configuration réseau de l'hôte, ce qui fait échouer l'échange de jeton avec les fournisseurs
    # OAuth2 (getaddrinfo EAI_AGAIN). Des résolveurs publics explicites évitent d'en dépendre.
    # La résolution des noms de services (postgres, client) reste assurée par Docker.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: supmeal_client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  postgres_data:
  uploads_data:
