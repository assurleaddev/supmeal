services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Les trois valeurs sensibles de cette pile ont une valeur de repli préfixée « change_me ». Le
    # cahier des charges exige que l'application se lance « intégralement via docker compose » : sur
    # un dépôt fraîchement cloné, `.env` n'existe pas — il est ignoré par git — et exiger sa création
    # ferait échouer cette commande. Le repli garantit une pile fonctionnelle sans étape préalable.
    #
    # Ce ne sont pas des secrets, ce sont des marqueurs, de même nature que ceux de `.env.example` :
    # le serveur les reconnaît au démarrage (PLACEHOLDER_MARKERS) et avertit tant qu'ils sont en
    # place. Un déploiement réel renseigne `.env`, qui prend le pas sur ces valeurs.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-supmeal}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-change_me_local_postgres_password}"
      POSTGRES_DB: ${POSTGRES_DB:-supmeal}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Les ports hôte sont redéfinissables. Aucun nom de conteneur n'est imposé non plus : Compose les
    # dérive du nom de projet, ce qui laisse cette pile cohabiter avec d'autres conteneurs et
    # autoriser deux instances en parallèle (`docker compose -p autre up`).
    #
    # Le port *interne* ne change jamais : les services se joignent par leur nom sur le réseau
    # Docker, indépendamment de ce qui est publié sur l'hôte.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-supmeal} -d ${POSTGRES_DB:-supmeal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER:-supmeal}:${POSTGRES_PASSWORD:-change_me_local_postgres_password}@postgres:5432/${POSTGRES_DB:-supmeal}"
      JWT_SECRET: "${JWT_SECRET:-change_me_local_jwt_access_secret_not_for_production}"
      JWT_REFRESH_SECRET: "${JWT_REFRESH_SECRET:-change_me_local_jwt_refresh_secret_not_for_production}"
      PORT: 3000
      CLIENT_URL: ${CLIENT_URL:-http://localhost:8080}
      NODE_ENV: ${NODE_ENV:-production}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      OAUTH_CALLBACK_BASE: ${OAUTH_CALLBACK_BASE:-http://localhost:3000}
    # Le résolveur DNS embarqué de Docker ne relaie pas toujours les requêtes externes selon la
    # configuration réseau de l'hôte, ce qui fait échouer l'échange de jeton avec les fournisseurs
    # OAuth2 (getaddrinfo EAI_AGAIN). Des résolveurs publics explicites évitent d'en dépendre.
    # La résolution des noms de services (postgres, client) reste assurée par Docker.
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "${SERVER_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "${CLIENT_PORT:-8080}:80"

volumes:
  postgres_data:
  uploads_data:
