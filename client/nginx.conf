server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Le défaut de nginx est 1 Mo, en dessous des limites que l'API annonce : 5 Mo pour une
        # image de recette, 10 Mo pour un fichier d'import. Une photo de 2 Mo était donc rejetée
        # par le proxy avec une page HTML « 413 Request Entity Too Large » — pas une erreur JSON —
        # alors que la même requête aboutissait en direct sur le port 3000.
        #
        # La valeur est calée sur la plus grande limite applicative. Le proxy ne doit pas arbitrer
        # une règle métier : il laisse passer, et le serveur refuse avec un message exploitable.
        client_max_body_size 10m;
    }

    # Images de recettes servies par l'API.
    #
    # Le modificateur `^~` est indispensable : nginx évalue les blocs `location` en expression
    # régulière AVANT les blocs préfixe, si bien que le bloc de cache statique plus haut captait
    # /uploads/recipes/*.png et tentait de le servir depuis le disque du conteneur client, où il
    # n'existe pas. Les images de recettes renvoyaient donc 404 derrière le proxy alors qu'elles
    # étaient bien servies en direct par l'API. `^~` donne la priorité à ce préfixe.
    location ^~ /uploads/ {
        proxy_pass http://server:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 30d;
        add_header Cache-Control "public";
    }

    # Proxy Socket.io with WebSocket support
    location /socket.io/ {
        proxy_pass http://server:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # React Router — serve index.html for all other routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header X-XSS-Protection "1; mode=block";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
}
